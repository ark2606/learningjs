<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin : 0px;
            padding : 0px;
        }
        .container {
            width : 1500px;
            height : 1500px ;
            background-color: beige;
            border: 3px solid black;
            
        } 
        .box{
            width : 100px;
            height : 100px;
            background-color: aqua;
            border : 2px black solid;
            margin : 1px;
            position : relative ;
            animation-name : rightMovement ;
            
            animation-duration : 3s;
            animation-iteration-count: 1;
            animation-delay: 0s;
            animation-timing-function: cubic-bezier(.44,.35,.75,1);
            animation-fill-mode: both;
            /* animation-direction :alternate-reverse ; */
        }
        
        @keyframes rightMovement {
            from {
                top : 0px;
                left : 0px ;
            }
            to {
                top : 0px;
                left : 1400px;
            }
        }
        @keyframes leftMovement {
            from {
                top : 0px;
                left : 1500px;
            }
            to {
                top : 0px;
                left : 1500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>


</body>
</html>
