<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container {
            background-color: beige;
            border : 2px solid black ;
            display : flex;
            padding : 2px;
            flex-direction : row;
        }
    .flex1 {
        width : 100px;
        height : 100px;
        border : 2px solid black ;
        background-color: lightblue ;
        margin : 2px;
    }
    .flex2 {
        width : 100px;
        height : 100px;
        border : 2px solid black ;
        background-color: lightpink ;
        margin : 2px;
    }
    .image{
        width : 200px;
        height : 200px;
        border : 2px solid black ;
        background-color: lightgrey ;
        margin : 2px;
    }
    
    @media (max-width : 350px ){
        .container {
            flex-direction : column;
        }
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="Text">
        <div class="flex1">Text1</div>
        <div class="flex2">Text2</div>
        </div>
        <div class="image">Image</div>
    </div>
</body>
</html>
